{% assign item = include.item %}
<div class="card border-0 shadow-sm bg-white mb-3">
    <div class="row no-gutters">
        <div class="col-md-3 col-xl-2 p-3 pb-0 pb-md-3 pr-md-0">
            {%- if item.cover -%}
            <img data-src="{{ item.cover | relative_url }}" alt="{{ item.title }}" class="lazy w-100 rounded-sm"
                src="{{ '/assets/images/empty_300x200.png' | relative_url }}">
            {%- else -%}
            <svg class="bubble-visual-hash lazy w-100 rounded-sm" data-bubble-visual-hash="{{ item.id }}"
                viewBox="0 0 300 200"></svg>
            {%- endif -%}
        </div>
        <div class="col-md-9 col-xl-10 p-3">
            <h5 class="mt-0 mb-1 font-weight-normal">{{ item.title }}</h5>
            <p class="mt-0 mb-1 small text-muted">{{ item.description }}</p>
            <p class="small pb-0 mb-0 lh-125 text-muted abstract-links">
                {% if item.pdf %}
                <a target="_blank" href="{{ item.pdf | relative_url }}">[PDF]</a>
                {% endif %}
                {% for link in item.links %}
                <a target="_blank" href="{{ link[1] }}">[{{ link[0] }}]</a>
                {% endfor %}
            </p>
        </div>
    </div>
</div>
